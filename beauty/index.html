  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --accent: #A04F2D;
      --accent-hover: #853e21;
      --accent-soft: #fef7ee;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    a { text-decoration: none; color: inherit; }

    /* HEADER */
    header { background: #ffffff; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 30; }
    .header-container { max-width: 1400px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; }
    .brand h1 { margin: 0; font-size: 18px; font-weight: 800; color: #0f172a; }
    .brand p { margin: 2px 0 0; font-size: 11.5px; color: var(--muted); }

    /* FILTER BAR HORIZONTAL TOPBAR (PENGGANTI SIDEBAR) */
    .filter-panel-top {
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.03);
    }
    .filter-panel-inner { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }

    /* BARIS 1: TAKSONOMI BERTINGKAT (SMART CASCADE L1 -> L2 -> L3) */
    .filter-row-taxonomy {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    /* BARIS 2: SEARCH, SORT, & RESET */
    .filter-row-controls {
      display: grid;
      grid-template-columns: 1fr 180px 100px;
      gap: 10px;
      align-items: center;
    }

    .form-group { display: flex; flex-direction: column; }
    .form-label { font-size: 11px; font-weight: 800; color: var(--muted); margin-bottom: 4px; display: flex; align-items: center; gap: 4px; text-transform: uppercase; letter-spacing: .04em; }
    .step-num { width: 15px; height: 15px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; font-size: 9.5px; font-weight: 800; }

    select, .search-input {
      width: 100%; border: 1px solid var(--border); border-radius: 6px; background: #ffffff;
      padding: 8px 10px; font-size: 12.5px; color: var(--text); outline: none; transition: border-color 0.15s;
    }
    select:focus, .search-input:focus { border-color: var(--accent); }
    select:disabled { background: #f8fafc; color: #94a3b8; cursor: not-allowed; }

    .btn {
      border: 1px solid var(--border); background: #ffffff; padding: 8px 12px; border-radius: 6px;
      font-size: 12.5px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    }
    .btn:hover { background: #f1f5f9; }
    .btn.primary { background: var(--accent); color: #ffffff; border-color: var(--accent); }
    .btn.primary:hover { background: var(--accent-hover); }

    /* STATUS BAR HASIL */
    .status-bar {
      max-width: 1400px; margin: 14px auto 0; padding: 0 20px;
      display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted);
    }

    /* GRID PRODUK FULL WIDTH (4-5 KOLOM DI DESKTOP, 2 DI MOBILE) */
    .main-container { max-width: 1400px; margin: 0 auto; padding: 12px 20px 60px; }
    .product-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }

    .product-card {
      background: #ffffff; border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
      display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.18s, box-shadow 0.18s;
      position: relative;
    }
    .product-card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(0,0,0,0.06); border-color: #cbd5e1; }

/* AREA UTAMA KARTU YANG BISA DIKLIK (CLICKABLE BODY) */
    .card-click-area {
      display: flex;
      flex-direction: column;
      flex: 1;
      color: inherit;
      text-decoration: none;
      cursor: pointer;
    }
    
    /* Efek hover lembut pada judul dan gambar saat kartu disentuh kursor */
    .card-click-area:hover .product-title {
      color: var(--accent);
      text-decoration: underline;
    }
    
    .card-click-area:hover .thumb-img {
      transform: scale(1.04);
    }

    .thumb-img {
      transition: transform 0.25s ease;
    }

    /* ANTI-CLS ASPECT RATIO 1:1 EKSPLISIT */
    .thumb-wrap { width: 100%; aspect-ratio: 1/1; position: relative; background: #f1f5f9; overflow: hidden; }
    .thumb-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .code-badge { position: absolute; top: 6px; left: 6px; background: rgba(15,23,42,0.78); backdrop-filter: blur(4px); color: #fff; font-size: 9.5px; font-weight: 800; padding: 2px 5px; border-radius: 4px; font-family: monospace; }

    .card-body { padding: 10px 12px 6px; flex: 1; display: flex; flex-direction: column; }
    .price-text { font-size: 14px; font-weight: 800; color: #15803d; margin-bottom: 4px; }
    .product-title { font-size: 12.5px; font-weight: 700; line-height: 1.35; margin: 0 0 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    /* TOMBOL BELI HIGH CONVERSION */
    .card-cta-area { padding: 8px 12px 10px; border-top: 1px dashed var(--border); display: flex; gap: 5px; align-items: center; }
.btn-buy-primary {
    flex: 1;
    background: var(--bg);
    color: var(--text);
    font-size: 11px;
    font-weight: 800;
    padding: 6px 8px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    transition: background 0.15s;
}
    .btn-buy-primary:hover { background: var(--accent-soft); }
    .btn-buy-primary svg { width: 14px; height: 14px; fill: #fff; flex-shrink: 0; }

    .btn-alt-store {
      width: 28px; height: 28px; border: 1px solid var(--border); border-radius: 6px; background: #f8fafc;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .btn-alt-store:hover { background: #ffffff; border-color: var(--accent); }
    .btn-alt-store svg { width: 14px; height: 14px; }

    /* RESPONSIVE BREAKPOINTS */
    @media (max-width: 1200px) { .product-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    @media (max-width: 900px) {
      .filter-row-taxonomy { grid-template-columns: 1fr; }
      .filter-row-controls { grid-template-columns: 1fr 1fr; }
      .filter-row-controls button { grid-column: 1 / -1; }
      .product-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 600px) {
      .product-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .header-container, .filter-panel-top, .status-bar, .main-container { padding-left: 12px; padding-right: 12px; }
    }
  </style>
</head>

<!-- HEADER UTAMA -->
<header>
  <div class="header-container">
    <div class="brand">
      <div>
        <h1 id="brand-title">Katalog Kecantikan & Perawatan Diri</h1>
        <p id="brand-subtitle">Koleksi Terkurasi Berdasarkan Kualitas, Bukan Tren Sesaat</p>
      </div>
    </div>
    <div style="display:flex; gap:6px;">
      <button class="btn" onclick="shareCatalog()">🔗 Bagikan</button>
    </div>
  </div>
</header>

<!-- FILTER BAR HORIZONTAL TOPBAR (SMART-DRIVEN DARI NAV_DIMENSIONS) -->
<section class="filter-panel-top">
  <div class="filter-panel-inner">
    
    <!-- BARIS 1: TAKSONOMI BERTINGKAT L1 -> L2 -> L3 -->
    <div class="filter-row-taxonomy">
      <div class="form-group">
        <label class="form-label"><span class="step-num">1</span> Kategori Utama</label>
        <select id="filterCategory" onchange="onCategoryFilterChange()">
          <option value="">Semua Kategori</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label"><span class="step-num">2</span> Sub-Kategori</label>
        <select id="filterSubcategory" onchange="onSubcategoryFilterChange()" disabled>
          <option value="">Pilih Kategori Dahulu</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label"><span class="step-num">3</span> Sub-Sub (Varian Spesifik)</label>
        <select id="filterSubsub" onchange="applyFilters()" disabled>
          <option value="">Pilih Sub-Kategori Dahulu</option>
        </select>
      </div>
    </div>

    <!-- BARIS 2: SEARCH, SORT & RESET -->
    <div class="filter-row-controls">
      <input type="text" id="searchInput" class="search-input" placeholder="Cari nama produk, brand, atau kode B01..." oninput="applyFilters()">
      
      <select id="sortFilter" onchange="applyFilters()">
        <option value="default">Urutan: Default</option>
        <option value="price-low">Harga: Termurah</option>
        <option value="price-high">Harga: Tertinggi</option>
        <option value="name">Nama: A - Z</option>
      </select>

      <button class="btn" onclick="resetAllFilters()">↺ Reset</button>
    </div>

  </div>
</section>

<!-- STATUS BAR HASIL FILTER -->
<div class="status-bar">
  <div id="filterStatusLabel">Menampilkan seluruh koleksi produk</div>
  <div>Total: <strong id="productCount" style="color:var(--accent);">0</strong> produk</div>
</div>

<!-- GRID PRODUK UTAMA -->
<main class="main-container">
  <div id="productGrid" class="product-grid"></div>
  <div id="scrollSentinel" style="height: 30px; margin-top: 20px;"></div>
  
  <div id="emptyState" style="display:none; text-align:center; padding:60px 20px; color:var(--muted); background:#ffffff; border-radius:10px; border:1px dashed var(--border); margin-top:20px;">
    Tidak ada produk yang cocok dengan kombinasi filter yang Anda pilih.
  </div>
</main>

<script>
  // =========================================================================
  // KONFIGURASI MANDIRI ONLINE (MEMBACA DATA LANGSUNG DARI CDN PRODUKSI)
  // =========================================================================
  const urlParams = new URLSearchParams(window.location.search);
  
  // Bisa membaca katalog dinamis: ?catalog=beauty atau ?catalog=fashion-muslim
  const CATALOG_NAME = urlParams.get("catalog") || "beauty";
  
  // URL CDN online Anda (Tempat file JSON hasil ekspor CMS berada)
  const CDN_BASE_URL = "https://data.modenyania.com/shop";
  const URL_JSON_PRODUCTS = `${CDN_BASE_URL}/${CATALOG_NAME}.json?t=${Date.now()}`;
  const URL_JSON_CONFIG = `${CDN_BASE_URL}/${CATALOG_NAME}config.json?t=${Date.now()}`;

  let allProducts = [];
  let currentFiltered = [];
  let renderedCount = 0;
  const BATCH_SIZE = 20;

  let NAV_DIMENSIONS = [];
  let categoryData = {};

  // 1. INIT HALAMAN
  async function initStorefront() {
    try {
      await fetchConfig();
      await fetchProducts();
      setupInfiniteScroll();
    } catch(err) {
      console.error("Gagal inisialisasi:", err);
    }
  }

  // 2. FETCH CONFIG.JSON
  async function fetchConfig() {
    try {
      const res = await fetch(URL_JSON_CONFIG, { cache: "no-store" });
      const cfg = await res.json();
      NAV_DIMENSIONS = cfg.NAV_DIMENSIONS || [];
      categoryData = cfg.categoryData || {};
      
      populateCategoryDropdown();
      updateTitles();
    } catch(e) {
      console.warn("Config load error:", e);
    }
  }

  function updateTitles() {
    const formatted = CATALOG_NAME.replace(/[-_]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    document.title = `Katalog ${formatted} Terlengkap | Modenyania`;
    document.getElementById("brand-title").textContent = `Katalog ${formatted}`;
  }

  // 3. FETCH PRODUCTS.JSON
  async function fetchProducts() {
    const res = await fetch(URL_JSON_PRODUCTS, { cache: "no-store" });
    const data = await res.json();
    
    allProducts = data.map(p => {
      const c = Array.isArray(p.category) ? p.category : [p.category || ""];
      const s = Array.isArray(p.subcategory) ? p.subcategory : [p.subcategory || ""];
      const ss = Array.isArray(p.subsub) ? p.subsub : [p.subsub || ""];
      
      p.compiledTags = [...c, ...s, ...ss, p.searched || ""]
        .map(t => String(t).toLowerCase().trim())
        .filter(Boolean);
      return p;
    });

    applyFilters();
  }

  // 4. MENGISI DROPDOWN KATEGORI UTAMA (L1) DARI NAV_DIMENSIONS
  function populateCategoryDropdown() {
    const sel = document.getElementById("filterCategory");
    if (!sel) return;
    sel.innerHTML = `<option value="">Semua Kategori</option>`;

    NAV_DIMENSIONS.forEach(dim => {
      if (!dim.groups || !dim.groups.length) return;
      const optGroup = document.createElement("optgroup");
      optGroup.label = `— ${dim.title.toUpperCase()} —`;

      dim.groups.forEach(grp => {
        const opt = document.createElement("option");
        opt.value = grp.key.toLowerCase();
        opt.textContent = grp.label || grp.key;
        optGroup.appendChild(opt);
      });
      sel.appendChild(optGroup);
    });
  }

  function findNavGroup(key) {
    for (const dim of NAV_DIMENSIONS) {
      const found = (dim.groups || []).find(g => g.key.toLowerCase() === key.toLowerCase());
      if (found) return found;
    }
    return null;
  }

  // 5. TRIGGER SAAT L1 BERUBAH
  function onCategoryFilterChange() {
    const catVal = document.getElementById("filterCategory").value.trim().toLowerCase();
    const subcatSel = document.getElementById("filterSubcategory");
    const subsubSel = document.getElementById("filterSubsub");

    subcatSel.innerHTML = "";
    subsubSel.innerHTML = `<option value="">Pilih Sub-Kategori Dahulu</option>`;
    subsubSel.disabled = true;

    if (!catVal) {
      subcatSel.innerHTML = `<option value="">Pilih Kategori Dahulu</option>`;
      subcatSel.disabled = true;
      applyFilters();
      return;
    }

    const grp = findNavGroup(catVal);
    const items = grp?.items || [];

    if (items.length > 0) {
      subcatSel.disabled = false;
      subcatSel.innerHTML = `<option value="">Semua Sub-Kategori (${items.length})</option>`;
      items.forEach(it => {
        const key = typeof it === 'object' ? it.key : it;
        const label = typeof it === 'object' ? it.label : it;
        const opt = document.createElement("option");
        opt.value = key.toLowerCase();
        opt.textContent = label;
        subcatSel.appendChild(opt);
      });
    } else {
      subcatSel.innerHTML = `<option value="">(Tidak Ada Sub-Kategori)</option>`;
      subcatSel.disabled = true;
    }

    applyFilters();
  }

  // 6. TRIGGER SAAT L2 BERUBAH
  function onSubcategoryFilterChange() {
    const catVal = document.getElementById("filterCategory").value.trim().toLowerCase();
    const subcatVal = document.getElementById("filterSubcategory").value.trim().toLowerCase();
    const subsubSel = document.getElementById("filterSubsub");

    subsubSel.innerHTML = "";

    if (!subcatVal) {
      subsubSel.innerHTML = `<option value="">Pilih Sub-Kategori Dahulu</option>`;
      subsubSel.disabled = true;
      applyFilters();
      return;
    }

    const grp = findNavGroup(catVal);
    const it = grp?.items?.find(i => (typeof i === 'object' ? i.key.toLowerCase() : i.toLowerCase()) === subcatVal);
    const subitems = it?.subitems || [];

    if (subitems.length > 0) {
      subsubSel.disabled = false;
      subsubSel.innerHTML = `<option value="">Semua Sub-Sub (${subitems.length})</option>`;
      subitems.forEach(sub => {
        const subKey = Array.isArray(sub) ? sub[0] : (sub.key || sub);
        const subLabel = Array.isArray(sub) ? sub[1] : (sub.label || sub);
        const opt = document.createElement("option");
        opt.value = String(subKey).toLowerCase();
        opt.textContent = subLabel;
        subsubSel.appendChild(opt);
      });
    } else {
      subsubSel.innerHTML = `<option value="">(Tidak Ada Sub-Sub)</option>`;
      subsubSel.disabled = true;
    }

    applyFilters();
  }

  // 7. PENYARINGAN PRODUK LENGKAP
  function applyFilters() {
    const cat = document.getElementById("filterCategory")?.value.toLowerCase() || "";
    const subcat = document.getElementById("filterSubcategory")?.value.toLowerCase() || "";
    const subsub = document.getElementById("filterSubsub")?.value.toLowerCase() || "";
    const q = document.getElementById("searchInput")?.value.toLowerCase().trim() || "";
    const sort = document.getElementById("sortFilter")?.value || "default";

    currentFiltered = allProducts.filter(p => {
      const tags = p.compiledTags || [];
      const matchCat = !cat || tags.includes(cat);
      const matchSubcat = !subcat || tags.includes(subcat);
      const matchSubsub = !subsub || tags.includes(subsub);
      const matchQ = !q || p.name.toLowerCase().includes(q) || (p.searched && p.searched.toLowerCase().includes(q)) || tags.some(t => t.includes(q));

      return matchCat && matchSubcat && matchSubsub && matchQ;
    });

    // PENGURUTAN HARGA / NAMA
    if (sort === "price-low") {
      currentFiltered.sort((a, b) => parsePrice(a.price) - parsePrice(b.price));
    } else if (sort === "price-high") {
      currentFiltered.sort((a, b) => parsePrice(b.price) - parsePrice(a.price));
    } else if (sort === "name") {
      currentFiltered.sort((a, b) => a.name.localeCompare(b.name));
    }

    document.getElementById("productCount").textContent = currentFiltered.length;
    renderCards(true);
  }

  function parsePrice(str) {
    const digits = String(str || "").replace(/[^\d]/g, "");
    return digits ? parseInt(digits, 10) : 0;
  }

// 7. RENDER KARTU DENGAN SELURUH AREA BADAN KARTU CLICKABLE (KE FIRSTSHOPURL)
  function renderCards(reset = false) {
    const grid = document.getElementById("productGrid");
    const empty = document.getElementById("emptyState");

    if (reset) {
      grid.innerHTML = "";
      renderedCount = 0;
    }

    const batch = currentFiltered.slice(renderedCount, renderedCount + BATCH_SIZE);

    if (batch.length === 0 && renderedCount === 0) {
      empty.style.display = "block";
      return;
    }
    empty.style.display = "none";

    batch.forEach(p => {
      const card = document.createElement("div");
      card.className = "product-card";

      const links = p.links || [];
      
      // LOGIKA FIRSTSHOPURL: Ambil URL pertama dari array links, fallback ke properti p.firstshopUrl
      const primaryLink = (links.length > 0 && links[0].url) 
        ? links[0] 
        : { url: p.firstshopUrl || "#", "data-type": "Toko", logo: "logo-shopee" };
      
      const otherLinks = links.slice(1);

      // Otomatis pasang SubID pelacak komisi ke firstshopUrl
      const trackedFirstUrl = appendSubId(primaryLink.url, `${CATALOG_NAME}_${p.searched}`);

      card.innerHTML = `
        <!-- 1. SELURUH BADAN KARTU CLICKABLE (MENGARAH KE FIRSTSHOPURL) -->
        <a href="${escapeHtml(trackedFirstUrl)}" 
           class="card-click-area" 
           target="_blank" 
           rel="nofollow noopener"
           title="Beli ${escapeHtml(p.name)} di ${escapeHtml(primaryLink['data-type'] || 'Toko')}"
           onclick="trackAffiliateClick('${escapeHtml(p.searched)}', '${escapeHtml(primaryLink['data-type'] || 'Toko')}')">
          
          <div class="thumb-wrap">
            <span class="code-badge">${escapeHtml(p.searched || '')}</span>
            <img class="thumb-img" 
                 src="${escapeHtml(p.image)}" 
                 alt="${escapeHtml(p.name)}" 
                 width="300" 
                 height="300" 
                 loading="lazy" 
                 onerror="this.src='https://placehold.co/300x300?text=No+Image'">
          </div>

          <div class="card-body">
            <div class="price-text">${escapeHtml(p.price || 'Rp -')}</div>
            <h2 class="product-title" title="${escapeHtml(p.name)}">${escapeHtml(p.name)}</h2>
          </div>
        </a>

        <!-- 2. TOMBOL AKSI TOKO INDEPENDEN DI BAGIAN BAWAH -->
        <div class="card-cta-area">
          <a href="${escapeHtml(trackedFirstUrl)}" 
             class="btn-buy-primary" 
             target="_blank" 
             rel="nofollow noopener"
             title="Beli di ${escapeHtml(primaryLink['data-type'] || 'Toko')}"
             onclick="trackAffiliateClick('${escapeHtml(p.searched)}', '${escapeHtml(primaryLink['data-type'] || 'Toko')}')">
            <svg><use href="#${escapeHtml(primaryLink.logo || 'logo-shopee')}"></use></svg>
            <span>Beli di ${escapeHtml(primaryLink['data-type'] || 'Toko')}</span>
          </a>

          ${otherLinks.map(l => {
            const trackedAltUrl = appendSubId(l.url, `${CATALOG_NAME}_${p.searched}`);
            return `
              <a href="${escapeHtml(trackedAltUrl)}" 
                 class="btn-alt-store" 
                 target="_blank" 
                 rel="nofollow noopener" 
                 title="Beli di ${escapeHtml(l['data-type'] || 'Toko')}"
                 onclick="trackAffiliateClick('${escapeHtml(p.searched)}', '${escapeHtml(l['data-type'] || 'Toko')}')">
                <svg><use href="#${escapeHtml(l.logo || 'logo-shopee')}"></use></svg>
              </a>
            `;
          }).join('')}
        </div>
      `;

      grid.appendChild(card);
    });

    renderedCount += batch.length;
  }

  function appendSubId(rawUrl, subIdVal) {
    if (!rawUrl || !rawUrl.startsWith("http")) return rawUrl || "#";
    try {
      const u = new URL(rawUrl);
      if (u.hostname.includes("shopee")) {
        u.searchParams.set("sub_id", subIdVal);
      } else if (u.hostname.includes("tokopedia")) {
        u.searchParams.set("utm_campaign", subIdVal);
      }
      return u.toString();
    } catch(e) {
      return rawUrl;
    }
  }

  function trackAffiliateClick(sku, platform) {
    if (typeof fbq !== "undefined") {
      fbq('trackCustom', 'ClickToAffiliate', { content_ids: [sku], content_category: platform, catalog: CATALOG_NAME });
    }
    if (typeof dataLayer !== "undefined") {
      dataLayer.push({ event: 'affiliate_click', product_sku: sku, store_platform: platform, catalog_name: CATALOG_NAME });
    }
  }

  function setupInfiniteScroll() {
    const sentinel = document.getElementById("scrollSentinel");
    const observer = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting && renderedCount < currentFiltered.length) {
        renderCards(false);
      }
    }, { rootMargin: "300px" });

    if (sentinel) observer.observe(sentinel);
  }

  function resetAllFilters() {
    document.getElementById("filterCategory").value = "";
    document.getElementById("filterSubcategory").innerHTML = `<option value="">Pilih Kategori Dahulu</option>`;
    document.getElementById("filterSubcategory").disabled = true;
    document.getElementById("filterSubsub").innerHTML = `<option value="">Pilih Sub-Kategori Dahulu</option>`;
    document.getElementById("filterSubsub").disabled = true;
    document.getElementById("searchInput").value = "";
    document.getElementById("sortFilter").value = "default";
    applyFilters();
  }

  async function shareCatalog() {
    if (navigator.share) {
      try {
        await navigator.share({ title: document.title, url: window.location.href });
      } catch(e) {}
    } else {
      navigator.clipboard.writeText(window.location.href);
      alert("✅ Tautan katalog disalin ke clipboard!");
    }
  }

  function escapeHtml(str) {
    return String(str || "").replace(/[&<>"']/g, m => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;" }[m]));
  }

  window.addEventListener("DOMContentLoaded", initStorefront);
</script>
</body>
</html>
